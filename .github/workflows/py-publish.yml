name: Build and publish python package

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true
        description: PyPI API token used by the release publish step
      TEST_PYPI_API_TOKEN:
        required: false
        description: TestPyPI API token used on workflow_dispatch runs

permissions:
  contents: read

jobs:
  publish-to-pypi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install --upgrade pip twine

    - name: Build wheel
      run: python -m pip wheel -w dist --no-deps .

    - name: Check distribution
      run: twine check dist/*

    - name: Publish package (to TestPyPI)
      if: github.event_name == 'workflow_dispatch' && startsWith(github.repository, 'shenxianpeng')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: twine upload --repository testpypi dist/*

    - name: Publish package (to PyPI)
      if: github.event_name != 'workflow_dispatch' && startsWith(github.repository, 'shenxianpeng')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload --repository-url https://upload.pypi.org/legacy/ dist/*
